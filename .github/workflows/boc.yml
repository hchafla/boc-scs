name: Actualizar noticias BOC SCS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install feedparser beautifulsoup4

      - name: Actualizar noticias
        run: |
          python - <<'PY'
          import feedparser
          import json
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime

          RSS_URL = "https://www.gobiernodecanarias.org/boc/feeds/capitulo/autoridades_personal_oposiciones.rss"
          OUTPUT = "noticias.json"

          try:
              with open(OUTPUT, "r", encoding="utf-8") as f:
                  contenido = f.read().strip()

              if not contenido:
                  print("noticias.json está vacío. Se empezará desde cero.")
                  noticias = []
              else:
                  noticias = json.loads(contenido)

                  if not isinstance(noticias, list):
                      print("ERROR: noticias.json no contiene una lista.")
                      raise SystemExit(1)

          except FileNotFoundError:
              print("No existe noticias.json. Se creará uno nuevo.")
              noticias = []

          except json.JSONDecodeError:
              print("ERROR: noticias.json no contiene JSON válido.")
              raise SystemExit(1)

          ids_existentes = {
              noticia.get("id")
              for noticia in noticias
              if noticia.get("id")
          }

          print(
              f"Noticias existentes antes de procesar RSS: "
              f"{len(noticias)}"
          )

          print("Leyendo RSS del BOC...")

          feed = feedparser.parse(RSS_URL)

          print(
              f"Entradas encontradas en RSS: "
              f"{len(feed.entries)}"
          )

          nuevas = 0
          scs_encontradas = 0

          for entry in feed.entries:

              title_original = entry.get(
                  "title",
                  ""
              ).strip()

              if not title_original.startswith(
                  "Servicio Canario de la Salud.-"
              ):
                  continue

              scs_encontradas += 1

              entry_id = entry.get(
                  "id",
                  ""
              ).strip()

              if not entry_id:
                  print(
                      "Entrada SCS sin ID. Se ignora."
                  )
                  continue

              if entry_id in ids_existentes:

                  print(
                      f"Ya existe: {entry_id}"
                  )

                  continue

              title = re.sub(
                  r"^Servicio Canario de la Salud\.-\s*",
                  "",
                  title_original
              )

              published = entry.get(
                  "published",
                  ""
              ).strip()

              date = ""

              if published:

                  try:

                      dt = datetime.strptime(
                          published,
                          "%a, %d %b %Y %H:%M:%S %z"
                      )

                      date = dt.strftime(
                          "%Y-%m-%d"
                      )

                  except Exception as e:

                      print(
                          f"Error procesando fecha "
                          f"de {entry_id}: {e}"
                      )

              summary_html = entry.get(
                  "summary",
                  ""
              )

              soup = BeautifulSoup(
                  summary_html,
                  "html.parser"
              )

              text = soup.get_text(
                  " ",
                  strip=True
              )

              match = re.search(
                  r"CVE:\s*(BOC-[A-Z]-\d{4}-\d+-\d+)",
                  text
              )

              cve = (
                  match.group(1)
                  if match
                  else ""
              )

              noticia = {
                  "id": entry_id,
                  "title": title,
                  "url": entry.get(
                      "link",
                      ""
                  ),
                  "date": date,
                  "source": "BOC",
                  "organismo": "Servicio Canario de la Salud",
                  "cve": cve
              }

              noticias.append(noticia)

              ids_existentes.add(entry_id)

              nuevas += 1

              print()
              print("NUEVA NOTICIA AÑADIDA")
              print(
                  f"ID: {entry_id}"
              )
              print(
                  f"Fecha: {date}"
              )
              print(
                  f"Título: {title}"
              )
              print("-" * 80)

          noticias.sort(
              key=lambda noticia: (
                  noticia.get("date", ""),
                  noticia.get("id", "")
              ),
              reverse=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  noticias,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("=" * 80)
          print("RESUMEN")
          print("=" * 80)

          print(
              f"Entradas RSS: {len(feed.entries)}"
          )

          print(
              f"Noticias SCS encontradas: "
              f"{scs_encontradas}"
          )

          print(
              f"Nuevas noticias añadidas: "
              f"{nuevas}"
          )

          print(
              f"Total histórico: "
              f"{len(noticias)}"
          )

          print("=" * 80)

          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar noticias BOC SCS"
            git push
          fi
