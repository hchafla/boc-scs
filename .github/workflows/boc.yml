name: Actualizar noticias BOC SCS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install feedparser beautifulsoup4

      - name: Procesar RSS y enviar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import feedparser
          import json
          import re
          import os
          import html
          from bs4 import BeautifulSoup
          from datetime import datetime
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode

          RSS_URL = "https://www.gobiernodecanarias.org/boc/feeds/capitulo/autoridades_personal_oposiciones.rss"
          OUTPUT = "noticias.json"

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          # --------------------------------------------------
          # COMPROBAR CONFIGURACIÓN DE TELEGRAM
          # --------------------------------------------------

          if not TELEGRAM_BOT_TOKEN:
              print("ERROR: Falta el secret TELEGRAM_BOT_TOKEN")
              raise SystemExit(1)

          if not TELEGRAM_CHAT_ID:
              print("ERROR: Falta el secret TELEGRAM_CHAT_ID")
              raise SystemExit(1)

          # --------------------------------------------------
          # CARGAR NOTICIAS EXISTENTES
          # --------------------------------------------------

          try:
              with open(OUTPUT, "r", encoding="utf-8") as f:
                  noticias_existentes = json.load(f)

          except (FileNotFoundError, json.JSONDecodeError):
              noticias_existentes = []

          existentes = {
              noticia["id"]: noticia
              for noticia in noticias_existentes
              if noticia.get("id")
          }

          # --------------------------------------------------
          # LEER RSS
          # --------------------------------------------------

          print("Leyendo RSS del BOC...")

          feed = feedparser.parse(RSS_URL)

          print(f"Entradas RSS encontradas: {len(feed.entries)}")
          print("=" * 80)

          nuevas = 0
          noticias_scs = 0
          telegram_enviadas = 0
          telegram_errores = 0

          # --------------------------------------------------
          # PROCESAR ENTRADAS
          # --------------------------------------------------

          for entry in feed.entries:

              title_original = entry.get("title", "").strip()

              # Solo noticias del Servicio Canario de la Salud
              if not title_original.startswith(
                  "Servicio Canario de la Salud.-"
              ):
                  continue

              noticias_scs += 1

              entry_id = entry.get("id", "").strip()

              if not entry_id:
                  print("Entrada SCS sin ID. Se ignora.")
                  continue

              # --------------------------------------------------
              # COMPROBAR SI YA EXISTÍA
              # --------------------------------------------------

              ya_existia = entry_id in existentes

              # --------------------------------------------------
              # TÍTULO
              # --------------------------------------------------

              title = re.sub(
                  r"^Servicio Canario de la Salud\.-\s*",
                  "",
                  title_original
              )

              # --------------------------------------------------
              # FECHA
              # --------------------------------------------------

              published = entry.get("published", "").strip()

              date = ""

              if published:

                  try:

                      dt = datetime.strptime(
                          published,
                          "%a, %d %b %Y %H:%M:%S %z"
                      )

                      date = dt.strftime("%Y-%m-%d")

                  except Exception as e:

                      print(
                          f"ERROR procesando fecha: {e}"
                      )

              # --------------------------------------------------
              # RESUMEN / CVE
              # --------------------------------------------------

              summary_html = entry.get("summary", "")

              soup = BeautifulSoup(
                  summary_html,
                  "html.parser"
              )

              text = soup.get_text(
                  " ",
                  strip=True
              )

              match = re.search(
                  r"CVE:\s*(BOC-[A-Z]-\d{4}-\d+-\d+)",
                  text
              )

              cve = match.group(1) if match else ""

              # --------------------------------------------------
              # CREAR / ACTUALIZAR NOTICIA
              # --------------------------------------------------

              noticia = {
                  "id": entry_id,
                  "title": title,
                  "url": entry.get("link", ""),
                  "date": date,
                  "source": "BOC",
                  "organismo": "Servicio Canario de la Salud",
                  "cve": cve
              }

              if not ya_existia:

                  # Nueva noticia
                  noticia["telegram_notified"] = False

                  existentes[entry_id] = noticia

                  nuevas += 1

                  print()
                  print("NUEVA NOTICIA:")
                  print(title)
                  print(f"Fecha: {date}")
                  print(f"CVE: {cve}")
                  print(f"URL: {noticia['url']}")

              else:

                  # Actualizar datos existentes
                  existentes[entry_id].update(noticia)

                  # Si es una noticia antigua que todavía no tiene
                  # el campo telegram_notified, NO la enviamos.
                  if "telegram_notified" not in existentes[entry_id]:

                      existentes[entry_id]["telegram_notified"] = True

          # --------------------------------------------------
          # FUNCIÓN PARA ENVIAR TELEGRAM
          # --------------------------------------------------

          def enviar_telegram(noticia):

              titulo = html.escape(
                  noticia.get("title", "")
              )

              fecha = html.escape(
                  noticia.get("date", "")
              )

              cve = html.escape(
                  noticia.get("cve", "")
              )

              url = noticia.get("url", "")

              mensaje = (
                  "<b>📰 Nueva publicación del BOC</b>\n\n"
                  f"<b>{titulo}</b>\n\n"
                  f"📅 {fecha}\n"
              )

              if cve:
                  mensaje += f"🔎 CVE: {cve}\n"

              mensaje += (
                  f"\n🔗 <a href=\"{html.escape(url, quote=True)}\">"
                  "Ver publicación en el BOC"
                  "</a>"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendMessage"
              )

              data = urlencode({
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": mensaje,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "false"
              }).encode("utf-8")

              request = Request(
                  telegram_url,
                  data=data,
                  method="POST"
              )

              try:

                  with urlopen(request, timeout=30) as response:

                      respuesta = json.loads(
                          response.read().decode("utf-8")
                      )

                  if respuesta.get("ok"):

                      return True

                  print(
                      "Telegram respondió con error:"
                  )
                  print(respuesta)

                  return False

              except Exception as e:

                  print(
                      f"Error enviando a Telegram: {e}"
                  )

                  return False

          # --------------------------------------------------
          # ENVIAR NUEVAS NOTICIAS
          # --------------------------------------------------

          print()
          print("=" * 80)
          print("TELEGRAM")
          print("=" * 80)

          for entry_id, noticia in existentes.items():

              # Solo enviamos las que aún no han sido notificadas
              if noticia.get("telegram_notified") is not False:
                  continue

              print()
              print(
                  f"Enviando a Telegram: "
                  f"{noticia['title']}"
              )

              enviado = enviar_telegram(noticia)

              if enviado:

                  noticia["telegram_notified"] = True

                  telegram_enviadas += 1

                  print(
                      "✓ Telegram enviado correctamente"
                  )

              else:

                  telegram_errores += 1

                  print(
                      "✗ No se pudo enviar a Telegram"
                  )

          # --------------------------------------------------
          # ORDENAR NOTICIAS
          # --------------------------------------------------

          noticias = list(existentes.values())

          noticias.sort(
              key=lambda x: (
                  x.get("date", ""),
                  x.get("id", "")
              ),
              reverse=True
          )

          # --------------------------------------------------
          # GUARDAR JSON
          # --------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  noticias,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # --------------------------------------------------
          # RESUMEN
          # --------------------------------------------------

          print()
          print("=" * 80)
          print("RESUMEN")
          print("=" * 80)

          print(
              f"Entradas RSS: {len(feed.entries)}"
          )

          print(
              f"Noticias SCS encontradas: {noticias_scs}"
          )

          print(
              f"Nuevas noticias: {nuevas}"
          )

          print(
              f"Noticias enviadas a Telegram: "
              f"{telegram_enviadas}"
          )

          print(
              f"Errores Telegram: "
              f"{telegram_errores}"
          )

          print(
              f"Total histórico: {len(noticias)}"
          )

          print()
          print("Últimas noticias:")

          for noticia in noticias[:10]:

              print(
                  f"{noticia.get('date', '')} | "
                  f"{noticia.get('cve', '')} | "
                  f"{noticia.get('title', '')}"
              )

          print("=" * 80)

          # Si Telegram ha fallado, hacemos fallar el workflow.
          # Así queda claro que la notificación no se ha completado.
          if telegram_errores > 0:
              raise SystemExit(
                  "Se produjeron errores enviando noticias a Telegram."
              )

          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar noticias BOC SCS"
            git push
          fi
