name: Actualizar noticias BOC SCS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install feedparser beautifulsoup4

      - name: Actualizar noticias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          python - <<'PY'
          import feedparser
          import json
          import re
          import os
          import urllib.request
          import urllib.parse
          from bs4 import BeautifulSoup
          from datetime import datetime

          RSS_URL = "https://www.gobiernodecanarias.org/boc/feeds/capitulo/autoridades_personal_oposiciones.rss"
          OUTPUT = "noticias.json"

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          TELEGRAM_THREAD_ID = os.environ.get("TELEGRAM_THREAD_ID")

          # ============================================================
          # 1. CARGAR EL JSON EXISTENTE
          # ============================================================

          try:
              with open(OUTPUT, "r", encoding="utf-8") as f:
                  contenido = f.read().strip()

              if not contenido:
                  print("noticias.json está vacío. Se empezará desde cero.")
                  noticias = []
              else:
                  noticias = json.loads(contenido)

                  if not isinstance(noticias, list):
                      print("ERROR: noticias.json no contiene una lista.")
                      raise SystemExit(1)

          except FileNotFoundError:
              print("No existe noticias.json. Se creará uno nuevo.")
              noticias = []

          except json.JSONDecodeError:
              print("ERROR: noticias.json no contiene JSON válido.")
              raise SystemExit(1)

          ids_existentes = {
              noticia.get("id")
              for noticia in noticias
              if noticia.get("id")
          }

          print(
              f"Noticias existentes antes de procesar RSS: "
              f"{len(noticias)}"
          )

          # ============================================================
          # 2. LEER RSS
          # ============================================================

          print("Leyendo RSS del BOC...")

          feed = feedparser.parse(RSS_URL)

          print(
              f"Entradas encontradas en RSS: "
              f"{len(feed.entries)}"
          )

          nuevas = 0
          scs_encontradas = 0
          noticias_nuevas = []

          # ============================================================
          # 3. PROCESAR RSS
          # ============================================================

          for entry in feed.entries:

              title_original = entry.get(
                  "title",
                  ""
              ).strip()

              if not title_original.startswith(
                  "Servicio Canario de la Salud.-"
              ):
                  continue

              scs_encontradas += 1

              entry_id = entry.get(
                  "id",
                  ""
              ).strip()

              if not entry_id:
                  print(
                      "Entrada SCS sin ID. Se ignora."
                  )
                  continue

              if entry_id in ids_existentes:

                  print(
                      f"Ya existe: {entry_id}"
                  )

                  continue

              title = re.sub(
                  r"^Servicio Canario de la Salud\.-\s*",
                  "",
                  title_original
              )

              # ========================================================
              # FECHA
              # ========================================================

              published = entry.get(
                  "published",
                  ""
              ).strip()

              date = ""

              if published:

                  try:

                      dt = datetime.strptime(
                          published,
                          "%a, %d %b %Y %H:%M:%S %z"
                      )

                      date = dt.strftime(
                          "%Y-%m-%d"
                      )

                  except Exception as e:

                      print(
                          f"Error procesando fecha "
                          f"de {entry_id}: {e}"
                      )

              # ========================================================
              # CVE
              # ========================================================

              summary_html = entry.get(
                  "summary",
                  ""
              )

              soup = BeautifulSoup(
                  summary_html,
                  "html.parser"
              )

              text = soup.get_text(
                  " ",
                  strip=True
              )

              match = re.search(
                  r"CVE:\s*(BOC-[A-Z]-\d{4}-\d+-\d+)",
                  text
              )

              cve = (
                  match.group(1)
                  if match
                  else ""
              )

              # ========================================================
              # URL DIRECTA AL PDF
              # ========================================================

              pdf_url = (
                  f"https://sede.gobiernodecanarias.org/boc/"
                  f"{cve.lower()}.pdf"
              )

              noticia = {
                  "id": entry_id,
                  "title": title,
                  "url": pdf_url,
                  "date": date,
                  "source": "BOC",
                  "organismo": "Servicio Canario de la Salud",
                  "cve": cve
              }

              noticias.append(noticia)

              ids_existentes.add(entry_id)

              noticias_nuevas.append(noticia)

              nuevas += 1

              print()
              print("NUEVA NOTICIA AÑADIDA")
              print(
                  f"ID: {entry_id}"
              )
              print(
                  f"Fecha: {date}"
              )
              print(
                  f"Título: {title}"
              )
              print(
                  f"PDF: {pdf_url}"
              )
              print("-" * 80)

          # ============================================================
          # 4. ORDENAR Y GUARDAR JSON
          # ============================================================

          noticias.sort(
              key=lambda noticia: (
                  noticia.get("date", ""),
                  noticia.get("id", "")
              ),
              reverse=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  noticias,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # 5. TELEGRAM
          # ============================================================

          for noticia in noticias_nuevas:

              mensaje = (
                  "📢 <b>Nueva publicación del BOC</b>\n\n"
                  f"<b>{noticia['title']}</b>\n\n"
                  f"📅 {noticia['date']}\n"
                  f"📄 {noticia['cve']}\n\n"
                  f"🔗 <a href=\"{noticia['url']}\">Ver documento oficial</a>"
              )

              if not TELEGRAM_BOT_TOKEN:
                  print(
                      "ERROR: TELEGRAM_BOT_TOKEN no está configurado."
                  )
                  continue

              if not TELEGRAM_CHAT_ID:
                  print(
                      "ERROR: TELEGRAM_CHAT_ID no está configurado."
                  )
                  continue

              if not TELEGRAM_THREAD_ID:
                  print(
                      "ERROR: TELEGRAM_THREAD_ID no está configurado."
                  )
                  continue

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": TELEGRAM_CHAT_ID,
                  "message_thread_id": TELEGRAM_THREAD_ID,
                  "text": mensaje,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "false"
              }).encode("utf-8")

              try:

                  request = urllib.request.Request(
                      telegram_url,
                      data=data,
                      method="POST"
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      respuesta = response.read().decode(
                          "utf-8"
                      )

                  print()
                  print("TELEGRAM: mensaje enviado")
                  print(respuesta)

              except Exception as e:

                  print()
                  print(
                      f"ERROR enviando a Telegram: {e}"
                  )

          # ============================================================
          # 6. RESUMEN
          # ============================================================

          print()
          print("=" * 80)
          print("RESUMEN")
          print("=" * 80)

          print(
              f"Entradas RSS: {len(feed.entries)}"
          )

          print(
              f"Noticias SCS encontradas: "
              f"{scs_encontradas}"
          )

          print(
              f"Nuevas noticias añadidas: "
              f"{nuevas}"
          )

          print(
              f"Notificaciones Telegram: "
              f"{len(noticias_nuevas)}"
          )

          print(
              f"Total histórico: "
              f"{len(noticias)}"
          )

          print("=" * 80)

          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar noticias BOC SCS"
            git push
          fi
